name: Kiosk Supabase security

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/phase3*_quotes*"
      - "lib/quotes/**"
      - "app/api/quotes/**"
      - "supabase/tests/phase12_kiosk_public_orders.sql"
      - "supabase/tests/phase12_kiosk_concurrency.sh"
      - "supabase/tests/phase19_order_status_settings.sql"
      - "supabase/tests/phase19_order_status_concurrency.sh"
      - "supabase/tests/phase20_settings_catalogs.sql"
      - "supabase/tests/phase21_services_catalog.sql"
      - "supabase/tests/phase22_tenant_file_limits.sql"
      - "supabase/tests/phase22_storage_quota_concurrency.sh"
      - "supabase/tests/phase23_billing_foundation.sql"
      - "supabase/tests/phase24_billing_checkout_webhook.sql"
      - "supabase/tests/phase25_paid_onboarding.sql"
      - "supabase/tests/phase26_paid_onboarding_security.sql"
      - "supabase/tests/phase27_paid_onboarding_concurrency.sql"
      - "lib/billing/**"
      - "lib/onboarding/**"
      - "app/api/billing/**"
      - "app/api/onboarding/**"
      - "app/api/webhooks/stripe/**"
      - "app/onboarding/**"
      - "app/settings/billing/**"
      - "components/onboarding/**"
      - "lib/tenant/current-tenant.ts"
      - "lib/tenant/domains.ts"
      - "scripts/billing/**"
      - "supabase/rollbacks/**"
      - "app/api/kiosk/**"
      - "app/kiosk/**"
      - "components/kiosk/**"
      - "lib/kiosk/**"
      - "proxy.ts"
      - "lib/orders/create.ts"
      - "lib/orders/create.test.ts"
      - "lib/tenant/hostname.ts"
      - "lib/invitations/public-path.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kiosk-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiosk-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI_VERSION: 2.117.0
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript application gates
        run: |
          npx tsx --test
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Start minimal local Supabase
        run: >-
          npx supabase@${SUPABASE_CLI_VERSION} start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Capture exact pre-Kiosk trigger contract
        run: |
          npx supabase@${SUPABASE_CLI_VERSION} db reset \
            --local --no-seed --version 20260915143000
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -At \
            -f supabase/rollbacks/snapshot_order_activity_trigger.sql \
            > /tmp/order-trigger-before.json

      - name: Rebuild database from all migrations
        run: npx supabase@${SUPABASE_CLI_VERSION} db reset --local --no-seed

      - name: Run Kiosk database security tests
        run: |
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase12_kiosk_public_orders.sql
          bash supabase/tests/phase12_kiosk_concurrency.sh "${LOCAL_DB_URL}"

      - name: Run Settings V1 database invariant suites
        run: |
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase19_order_status_settings.sql
          bash supabase/tests/phase19_order_status_concurrency.sh "${LOCAL_DB_URL}"
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase20_settings_catalogs.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase21_services_catalog.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase22_tenant_file_limits.sql
          bash supabase/tests/phase22_storage_quota_concurrency.sh "${LOCAL_DB_URL}"
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase23_billing_foundation.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase24_billing_checkout_webhook.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase25_paid_onboarding.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase26_paid_onboarding_security.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase27_paid_onboarding_concurrency.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase28_paid_onboarding_checkout_idempotency.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase29_paid_onboarding_checkout_creating_recovery.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase30_order_statuses_require_initial_security_definer.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase31_tenant_provisioning_state.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase32_stripe_live_hardening.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase33_quotes_v1.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase34_quotes_operational_access.sql
          bash supabase/tests/phase33_quotes_concurrency.sh "${LOCAL_DB_URL}"
          QUOTE_TEST_ROLE=staff bash supabase/tests/phase33_quotes_concurrency.sh "${LOCAL_DB_URL}"

      - name: Apply and verify exact rollback
        run: |
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/rollbacks/20260915191521_kiosk_public_orders.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/rollbacks/verify_20260915191521_kiosk_public_orders.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -At \
            -f supabase/rollbacks/snapshot_order_activity_trigger.sql \
            > /tmp/order-trigger-after.json
          diff -u \
            /tmp/order-trigger-before.json \
            /tmp/order-trigger-after.json

      - name: Stop local Supabase
        if: always()
        run: npx supabase@${SUPABASE_CLI_VERSION} stop --no-backup
