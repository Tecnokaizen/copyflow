name: Tamara operational access and views

on:
  pull_request:
    paths:
      - "app/orders/**"
      - "app/api/orders/**"
      - "app/api/dashboard/**"
      - "lib/nav/**"
      - "lib/print/**"
      - "lib/orders/operational-access*"
      - "lib/dashboard/operational-access*"
      - "scripts/tamara-orders-ui-smoke.mjs"
      - "supabase/tests/tamara_operational_access.sql"
      - ".github/workflows/tamara-operativa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: UTC
    steps:
      # supabase/config.toml binds fixed host ports (54320-54329) that fall inside
      # Linux's ephemeral range (32768-60999). Reserve them before any network
      # traffic so no outgoing connection can grab 54322 ahead of `supabase start`.
      - name: Reserve local Supabase ports from the ephemeral range
        run: |
          before="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "ip_local_reserved_ports before: '${before}'"
          sudo sysctl -q -w net.ipv4.ip_local_reserved_ports="${before:+${before},}54320-54329"
          after="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "ip_local_reserved_ports after: '${after}'"
          covered=false
          IFS=, read -ra ranges <<< "${after}"
          for r in "${ranges[@]}"; do
            if [ "${r%-*}" -le 54322 ] && [ "${r#*-}" -ge 54322 ]; then covered=true; fi
          done
          if [ "${covered}" != true ]; then echo "::error::port 54322 is not reserved"; exit 1; fi
          held="$(ss -Htan 'sport >= :54320 and sport <= :54329')"
          if [ -n "${held}" ]; then echo "::warning::Supabase ports already in use:"; echo "${held}"; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Orders views (desktop and mobile)
        run: |
          npm install --prefix /tmp/pedido-v2-browser --no-audit --no-fund --ignore-scripts playwright@1.58.2
          node /tmp/pedido-v2-browser/node_modules/playwright/cli.js install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/pedido-v2-browser/node_modules/playwright/index.mjs node scripts/tamara-orders-ui-smoke.mjs
      - name: Start local database with all migrations
        run: |
          npx supabase@2.117.0 start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          npx supabase@2.117.0 db reset --local --no-seed
      - name: Tenant isolation, active memberships and administrative restrictions
        run: |
          for suite in tamara_operational_access; do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f "supabase/tests/${suite}.sql"
          done
